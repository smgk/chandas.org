<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chaṃdas (Beta)</title>
    <script src="meter_analysis.js" defer></script>
    <script src="utils.js" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
            transition: all 0.3s ease-in-out;
            position: relative;
        }
        .social-buttons {
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .social-buttons a {
            margin: 0 5px;
            color: #333;
            text-decoration: none;
            font-size: 20px;
        }
        .social-buttons a:hover {
            color: #007bff;
        }
        .copy-button {
            margin: 0 5px;
            color: #333;
            text-decoration: none;
            font-size: 20px;
            cursor: pointer;
        }
        .copy-button:hover {
            color: #007bff;
        }
        textarea {
            width: 100%;
            height: 120px;
            font-size: 16px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            transition: all 0.3s ease-in-out;
        }
        textarea:focus {
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.2);
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            text-align: left;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s, transform 0.5s;
        }
        .result.show {
            opacity: 1;
            transform: translateY(0);
        }
        .label {
            font-weight: bold;
            color: #333;
        }
        .output {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 5px;
            transition: all 0.3s ease-in-out;
        }
        .deviation {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="social-buttons">
            <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook-f"></i></a>
            <a href="https://www.twitter.com" target="_blank"><i class="fab fa-twitter"></i></a>
            <a href="https://www.linkedin.com" target="_blank"><i class="fab fa-linkedin-in"></i></a>
            <span class="copy-button" onclick="copyToClipboard()"><i class="fas fa-copy"></i></span>
        </div>
        <h1>chaṃdas.org (Beta)</h1>
        
        <!-- Text input area for users to enter poetry -->
        <textarea id="inputText" placeholder="Enter text in an Devanagari/Kannada..."></textarea>
        
        <!-- Dropdown to select a predefined meter -->
        <label for="meterSelect">Choose a meter:</label>
        <select id="meterSelect">
            <option value="">Auto Detect</option>
            <option value="Anushtubh">Anushtubh</option>
            <option value="Indravajra">Indravajra</option>
            <option value="Upendravajra">Upendravajra</option>
        </select>
        
        <div id="lineResultsContainer"></div>
        
        <div class="result" id="result">
            <p class="label">Detected Script:</p>
            <p class="output" id="scriptOutput">-</p>
            <p class="label">Detected Meter:</p>
            <p class="output" id="detectedMeter">-</p>
            <p class="label">Approximate Meters:</p>
            <p class="output" id="approxMeters">-</p>
            <p class="label">Meter Pattern:</p>
            <p class="output" id="patternOutput"></p>
        </div>
    </div>

    <script>
        // Event listeners to trigger analysis when text is entered or meter is selected
        document.getElementById("inputText").addEventListener("input", analyzeText);
        document.getElementById("meterSelect").addEventListener("change", analyzeText);

        function analyzeText() {
            const text = document.getElementById("inputText").value;
            const selectedMeter = document.getElementById("meterSelect").value;
            const resultContainer = document.getElementById("result");
            const lineResultsContainer = document.getElementById("lineResultsContainer");
            lineResultsContainer.innerHTML = "";
            
            // If input is empty, reset the results
            if (!text.trim()) {
                resultContainer.classList.remove("show");
                document.getElementById("patternOutput").innerHTML = "-";
                document.getElementById("scriptOutput").innerText = "-";
                document.getElementById("detectedMeter").innerText = "-";
                document.getElementById("approxMeters").innerText = "-";
                return;
            }
            
            // Normalize whitespace in the input text
            const normalizedText = normalizeWhitespace(text);
            
            // Call meter analysis function with selected meter if applicable
            const result = analyzeMeter(normalizedText, selectedMeter);
            document.getElementById("scriptOutput").innerText = result.detectedScript;
            document.getElementById("detectedMeter").innerText = result.detectedmeter || "-";
            document.getElementById("approxMeters").innerText = result.aproxmeters ? result.aproxmeters.join(", ") : "-";
            
            // Generate HTML for the metrical pattern, highlighting deviations in red
            let patternHTML = "";
            result.pattern.forEach(syllableObj => {
                if (syllableObj.expected && syllableObj.expected !== syllableObj.actual) {
                    patternHTML += `<span class="deviation">${syllableObj.syllable}${syllableObj.actual}</span> `;
                } else {
                    patternHTML += `<span>${syllableObj.syllable}${syllableObj.actual}</span> `;
                }
            });
            document.getElementById("patternOutput").innerHTML = patternHTML;
            
            // Display the result section
            resultContainer.classList.add("show");
        }

        function copyToClipboard() {
            const text = document.getElementById("inputText").value;
            navigator.clipboard.writeText(text).then(() => {
                alert("Text copied to clipboard!");
            }).catch(err => {
                console.error("Failed to copy text: ", err);
            });
        }
    </script>
</body>
</html>
