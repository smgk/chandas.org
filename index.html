<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chandas Meter Analyzer</title>
    <script src="meter_analysis.js" defer></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: auto;
            transition: all 0.3s ease-in-out;
        }
        textarea {
            width: 100%;
            height: 120px;
            font-size: 16px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            transition: all 0.3s ease-in-out;
        }
        textarea:focus {
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.2);
        }
        .result {
            margin-top: 20px;
            font-size: 18px;
            text-align: left;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s, transform 0.5s;
        }
        .result.show {
            opacity: 1;
            transform: translateY(0);
        }
        .label {
            font-weight: bold;
            color: #333;
        }
        .output {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 5px;
            transition: all 0.3s ease-in-out;
        }
        .deviation {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chandas Meter Analyzer</h1>
        <textarea id="inputText" placeholder="Enter text in an Indian script..."></textarea>
        <label for="meterSelect">Choose a meter:</label>
        <select id="meterSelect">
            <option value="">Auto Detect</option>
            <option value="Anushtubh">Anushtubh</option>
            <option value="Indravajra">Indravajra</option>
            <option value="Upendravajra">Upendravajra</option>
        </select>
        <div id="lineResultsContainer"></div>
        <div class="result" id="result">
            <p class="label">Detected Script:</p>
            <p class="output" id="scriptOutput">-</p>
            <p class="label">Detected Meter:</p>
            <p class="output" id="detectedMeter">-</p>
            <p class="label">Approximate Meters:</p>
            <p class="output" id="approxMeters">-</p>
            <p class="label">Meter Pattern:</p>
            <p class="output" id="patternOutput"></p>
        </div>
    </div>

    <script>
        document.getElementById("inputText").addEventListener("input", analyzeText);
        document.getElementById("meterSelect").addEventListener("change", analyzeText);

        function analyzeText() {
            const text = document.getElementById("inputText").value;
            const selectedMeter = document.getElementById("meterSelect").value;
            const resultContainer = document.getElementById("result");
            const lineResultsContainer = document.getElementById("lineResultsContainer");
            lineResultsContainer.innerHTML = "";
            
            if (!text.trim()) {
                resultContainer.classList.remove("show");
                document.getElementById("patternOutput").innerHTML = "-";
                document.getElementById("scriptOutput").innerText = "-";
                document.getElementById("detectedMeter").innerText = "-";
                document.getElementById("approxMeters").innerText = "-";
                return;
            }
            
            const result = analyzeMeter(text, selectedMeter);
            document.getElementById("scriptOutput").innerText = result.detectedScript;
            document.getElementById("detectedMeter").innerText = result.detectedmeter || "-";
            document.getElementById("approxMeters").innerText = result.aproxmeters ? result.aproxmeters.join(", ") : "-";
            
            let patternHTML = "";
            result.pattern.forEach(syllableObj => {
                if (syllableObj.expected && syllableObj.expected !== syllableObj.actual) {
                    patternHTML += `<span class="deviation">${syllableObj.syllable}${syllableObj.actual}</span> `;
                } else {
                    patternHTML += `<span>${syllableObj.syllable}${syllableObj.actual}</span> `;
                }
            });
            document.getElementById("patternOutput").innerHTML = patternHTML;
            
            resultContainer.classList.add("show");
        }
    </script>
</body>
</html>
